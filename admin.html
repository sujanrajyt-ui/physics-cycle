<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Physics Cycle – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css" />
  <style>
    .manage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid var(--glass-border, #e2e8f0);
      background: white;
    }

    .manage-row:last-child {
      border-bottom: none;
    }

    .manage-name {
      font-weight: 600;
      color: var(--text-primary, #1e293b);
      cursor: pointer;
      text-decoration: none;
    }

    .manage-name:hover {
      text-decoration: underline;
      color: var(--primary, #6366f1);
    }

    .action-btn {
      background: #f87171;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .action-btn:hover {
      background: #ef4444;
    }

    .btn-small {
      padding: 0.5rem 1rem;
      margin-top: 0;
      width: auto;
    }

    .admin-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .admin-card h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #1e293b;
    }

    .admin-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.3rem;
      margin-top: 0.75rem;
    }

    .admin-card select,
    .admin-card input[type="file"] {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
      box-sizing: border-box;
    }

    .admin-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.4rem;
      background: var(--primary, #6366f1);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .admin-btn:hover {
      opacity: 0.9;
    }

    .status-msg {
      margin-top: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .status-msg.success {
      background: #dcfce7;
      color: #15803d;
    }

    .status-msg.error {
      background: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">Physics Cycle – Admin</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="branches.html" class="nav-link">Notes</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- UPLOAD -->
    <div class="admin-card">
      <h2>Upload New File to GitHub</h2>
      <p style="font-size:0.85rem; color:#64748b; margin-top:-10px; margin-bottom:1.5rem;">Max file size: 4.5MB (GitHub
        API limit for base64 payloads)</p>

      <form id="uploadForm">
        <label>Subject</label>
        <select id="subject">
          <option value="PSP">PSP</option>
          <option value="Physics">Physics</option>
          <option value="Calculus">Calculus</option>
          <option value="Basic Electronics">Basic Electronics</option>
          <option value="ADLD">ADLD</option>
          <option value="UHV">UHV</option>
          <option value="COI">COI</option>
          <option value="Chemistry">Chemistry</option>
          <option value="EME">EME</option>
        </select>

        <label>Document Type</label>
        <select id="option">
          <option value="Chapter_1">Chapter 1</option>
          <option value="Chapter_2">Chapter 2</option>
          <option value="Chapter_3">Chapter 3</option>
          <option value="Chapter_4">Chapter 4</option>
          <option value="Chapter_5">Chapter 5</option>
          <option value="MCQ">MCQ</option>
          <option value="Question_Bank">Question Bank</option>
          <option value="Notes">Notes</option>
        </select>

        <label>File</label>
        <input id="file" type="file" accept="application/pdf" required>

        <button type="submit" class="admin-btn">Commit to GitHub</button>
      </form>

      <div id="uploadStatus" class="status-msg" style="display:none;"></div>
    </div>

    <!-- MANAGE FILES -->
    <div class="admin-card">
      <h2>Manage Files</h2>

      <div style="display:flex; gap:1rem; align-items:flex-end; margin-bottom:1.5rem;">
        <div style="flex:1;">
          <label>Select Subject</label>
          <select id="manageSubject" style="margin-bottom:0;">
            <option value="PSP">PSP</option>
            <option value="Physics">Physics</option>
            <option value="Calculus">Calculus</option>
            <option value="Basic Electronics">Basic Electronics</option>
            <option value="ADLD">ADLD</option>
            <option value="UHV">UHV</option>
            <option value="COI">COI</option>
            <option value="Chemistry">Chemistry</option>
            <option value="EME">EME</option>
          </select>
        </div>
        <button id="loadBtn" class="admin-btn btn-small" style="background:#475569;">Load Notes</button>
      </div>

      <div id="manageFilesBox" style="border:1px solid #cbd5e1; border-radius:8px; overflow:hidden;">
        <div style="padding:1rem; color:#64748b; font-size:0.9rem; text-align:center;">Click "Load Notes" to manage
          files.</div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Physics Cycle • By Sujanraj. All rights reserved.</p>
  </footer>

  <script type="module">
    /* ===== GITHUB AUTH SETUP ===== */
    let ghToken = null;

    // Silently grab the token from Vercel backend when page opens
    async function fetchTokenSilently() {
      try {
        const res = await fetch('/api/token?pass=sujanraj');
        if (res.ok) {
          const data = await res.json();
          ghToken = data.token;
        }
      } catch (e) {
        console.warn("Failed to securely pull token from backend");
      }
    }
    fetchTokenSilently();

    /* ===== FILE TO BASE64 HELPER ===== */
    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    /* ===== UPLOAD ===== */
    const uploadForm = document.getElementById('uploadForm');
    const uploadStatus = document.getElementById('uploadStatus');

    function setStatus(msg, type) {
      uploadStatus.style.display = 'block';
      uploadStatus.textContent = msg;
      uploadStatus.className = 'status-msg ' + type;
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!ghToken) { alert("GitHub Token not loaded yet. Check your Vercel /api/token endpoint."); return; }

      const subject = document.getElementById('subject').value;
      const option = document.getElementById('option').value;
      const file = document.getElementById('file').files[0];

      if (!subject || !file) {
        setStatus("Subject and File are required.", "error"); return;
      }

      if (file.size > 99 * 1024 * 1024) {
        setStatus("GitHub limit is 100MB per file.", "error"); return;
      }

      const finalFilename = `${subject}_${option}.pdf`;

      setStatus("Uploading file direct to GitHub (bypassing Vercel limits)...", "");

      try {
        const base64Content = await toBase64(file);

        const payload = {
          message: `CMS Upload: ${finalFilename} to ${subject}`,
          content: base64Content,
          branch: 'main'
        };

        const uploadRes = await fetch(`https://api.github.com/repos/sujanrajyt-ui/physics-cycle/contents/notes/${subject}/${finalFilename}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${ghToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!uploadRes.ok) {
          const errData = await uploadRes.json();
          if (errData.message === "Bad credentials") {
            throw new Error("Invalid GitHub Token! The token does not have 'repo' permissions or is typed wrong.");
          }
          throw new Error(errData.message || "Upload Failed");
        }

        setStatus(`Committed successfully to GitHub in notes/${subject}!`, "success");
        uploadForm.reset();

        if (document.getElementById('manageSubject').value === subject) {
          document.getElementById('loadBtn').click();
        }

      } catch (err) {
        setStatus(err.message, "error");
        console.error(err);
      }
    });


    /* ===== MANAGE FILES ===== */
    const loadBtn = document.getElementById('loadBtn');
    const manageFilesBox = document.getElementById('manageFilesBox');

    loadBtn.addEventListener('click', async () => {
      const subject = document.getElementById('manageSubject').value;
      manageFilesBox.innerHTML = `<div style="padding:1rem;text-align:center;color:#64748b;">Loading...</div>`;

      try {
        const res = await fetch(`https://api.github.com/repos/sujanrajyt-ui/physics-cycle/contents/notes/${subject}`, {
          headers: ghToken ? { 'Authorization': `Bearer ${ghToken}` } : {}
        });

        if (res.status === 404) {
          manageFilesBox.innerHTML = `<div style="padding:1rem;color:#64748b;text-align:center;">No files uploaded for ${subject} yet.</div>`;
          return;
        }
        if (!res.ok) throw new Error(`GitHub fetch failed (Status ${res.status})`);

        const files = await res.json();

        if (!files || files.length === 0) {
          manageFilesBox.innerHTML = `<div style="padding:1rem;color:#64748b;text-align:center;">No files uploaded for ${subject} yet.</div>`;
          return;
        }

        manageFilesBox.innerHTML = '';
        files.forEach(file => {
          const row = document.createElement('div');
          row.className = 'manage-row';

          const a = document.createElement('a');
          a.href = file.download_url;
          a.target = "_blank";
          a.className = "manage-name";
          a.textContent = file.name.replace(/_/g, ' ');

          const delBtn = document.createElement('button');
          delBtn.className = "action-btn";
          delBtn.textContent = "Delete";
          delBtn.onclick = async () => {
            if (!confirm(`Are you sure you want to permanently delete "${file.name}" from GitHub?`)) return;

            delBtn.textContent = "Deleting...";
            delBtn.disabled = true;

            try {
              const payload = {
                message: `CMS Delete: Remove ${file.path}`,
                sha: file.sha,
                branch: 'main'
              };

              const delRes = await fetch(`https://api.github.com/repos/sujanrajyt-ui/physics-cycle/contents/${file.path}`, {
                method: 'DELETE',
                headers: {
                  'Authorization': `Bearer ${ghToken}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              });

              if (!delRes.ok) {
                const err = await delRes.json();
                throw new Error(err.message || "Delete failed");
              }

              row.remove();
              if (manageFilesBox.children.length === 0) {
                manageFilesBox.innerHTML = `<div style="padding:1rem;color:#64748b;text-align:center;">No files in ${subject}.</div>`;
              }
            } catch (e) {
              alert(e.message);
              delBtn.textContent = "Delete";
              delBtn.disabled = false;
            }
          };

          row.appendChild(a);
          row.appendChild(delBtn);
          manageFilesBox.appendChild(row);
        });

      } catch (e) {
        manageFilesBox.innerHTML = `<div style="padding:1rem;color:#ef4444;font-weight:600;text-align:center;">Error loading files: ${e.message}</div>`;
      }
    });
  </script>

</body>

</html>
