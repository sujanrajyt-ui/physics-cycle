<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Upload - Physics Cycle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .admin-card h2 {
      font-size: 1.2rem;
      margin-bottom: 0.25rem;
      color: #1e293b;
    }

    .admin-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-top: 0.85rem;
      margin-bottom: 0.3rem;
    }

    .admin-card select,
    .admin-card input[type="file"] {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .admin-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.4rem;
      background: var(--primary, #6366f1);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .admin-btn:hover {
      opacity: 0.88;
    }

    .admin-btn.secondary {
      background: #64748b;
    }

    .status-msg {
      margin-top: 0.75rem;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }

    .status-msg.success {
      background: #dcfce7;
      color: #15803d;
      display: block;
    }

    .status-msg.error {
      background: #fee2e2;
      color: #b91c1c;
      display: block;
    }

    .status-msg.loading {
      background: #eff6ff;
      color: #1d4ed8;
      display: block;
    }

    .manage-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.85rem;
    }

    .manage-row:last-child {
      border-bottom: none;
    }

    .manage-name {
      word-break: break-all;
      font-weight: 500;
      color: #1e293b;
    }

    .delete-btn {
      flex-shrink: 0;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      border: none;
      cursor: pointer;
      background: #ef4444;
      color: #ffffff;
      font-weight: 600;
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    .files-box {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      max-height: 280px;
      overflow-y: auto;
      background: #f9fafb;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">Physics Cycle – Admin</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="branches.html" class="nav-link">Notes</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- UPLOAD -->
    <div class="admin-card">
      <h2>Upload New File</h2>
      <p style="font-size:0.85rem;color:#64748b;margin-bottom:0.5rem;">Choose subject, document type, and PDF to upload
        to Supabase.</p>

      <form id="uploadForm">
        <label>Subject</label>
        <select id="subjectSelect">
          <option value="PSP">PSP</option>
          <option value="Physics">Physics</option>
          <option value="Calculus">Calculus</option>
          <option value="Basic Electronics">Basic Electronics</option>
          <option value="ADLD">ADLD</option>
          <option value="UHV">UHV</option>
          <option value="COI">COI</option>
          <option value="Chemistry">Chemistry</option>
          <option value="EME">EME</option>
        </select>

        <label>Document Type</label>
        <select id="docType">
          <option value="Chapter_1">Chapter 1</option>
          <option value="Chapter_2">Chapter 2</option>
          <option value="Chapter_3">Chapter 3</option>
          <option value="Chapter_4">Chapter 4</option>
          <option value="Chapter_5">Chapter 5</option>
          <option value="MCQ">MCQ</option>
          <option value="Question_Bank">Question Bank</option>
          <option value="Notes">Notes</option>
        </select>

        <label>PDF File</label>
        <input id="fileInput" type="file" accept="application/pdf" required>

        <button type="submit" class="admin-btn">Upload to Supabase</button>
      </form>

      <div id="uploadStatus" class="status-msg"></div>
    </div>

    <!-- MANAGE -->
    <div class="admin-card">
      <h2>Manage Files</h2>
      <p style="font-size:0.85rem;color:#64748b;margin-bottom:0.75rem;">Select a subject to view and delete its files.
      </p>

      <div style="display:flex; gap:1rem; align-items:flex-end; margin-bottom:1rem;">
        <div style="flex:1;">
          <label style="margin-top:0;">Subject</label>
          <select id="manageSubjectSelect" style="margin-bottom:0;">
            <option value="PSP">PSP</option>
            <option value="Physics">Physics</option>
            <option value="Calculus">Calculus</option>
            <option value="Basic Electronics">Basic Electronics</option>
            <option value="ADLD">ADLD</option>
            <option value="UHV">UHV</option>
            <option value="COI">COI</option>
            <option value="Chemistry">Chemistry</option>
            <option value="EME">EME</option>
          </select>
        </div>
        <button id="loadFilesBtn" class="admin-btn secondary" style="margin-top:0;">Load Files</button>
      </div>

      <div id="filesList" class="files-box">
        <div style="padding:1rem;color:#9ca3af;font-size:0.85rem;text-align:center;">No subject selected.</div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Physics Cycle • By Sujanraj. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://brvbbxbfcrcpgkxxfuhv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydmJieGJmY3JjcGdreHhmdWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1NzM1MzIsImV4cCI6MjA4MDE0OTUzMn0.Z8FYzhVSn0eMgQAWcXg9ul70AeSyWMid4dFtrhAZalQ';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ===== UPLOAD =====
    const uploadForm = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const subjectSelect = document.getElementById('subjectSelect');
    const docType = document.getElementById('docType');
    const uploadStatus = document.getElementById('uploadStatus');

    function setStatus(msg, type) {
      uploadStatus.textContent = msg;
      uploadStatus.className = 'status-msg ' + type;
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = fileInput.files[0];
      const subject = subjectSelect.value;
      const dtype = docType.value;

      if (!file) { setStatus("Please choose a PDF file.", "error"); return; }

      setStatus("Uploading...", "loading");

      try {
        const path = `physics-cycle/${subject}/${dtype}_${file.name}`;

        const { error } = await sb.storage.from('notes').upload(path, file, { upsert: true });

        if (error) {
          setStatus("Upload failed: " + error.message, "error");
          return;
        }

        setStatus("Upload successful!", "success");
        fileInput.value = "";

        // Refresh manage list if same subject is open
        if (document.getElementById('manageSubjectSelect').value === subject) {
          loadFilesForSubject(subject);
        }
      } catch (err) {
        setStatus("Upload failed: " + err.message, "error");
      }
    });

    // ===== MANAGE =====
    async function loadFilesForSubject(subj) {
      const filesList = document.getElementById('filesList');
      filesList.innerHTML = '<div style="padding:1rem;color:#6b7280;text-align:center;font-size:0.85rem;">Loading files...</div>';

      const folder = `physics-cycle/${subj}`;

      const { data, error } = await sb.storage.from('notes').list(folder, {
        limit: 100, offset: 0,
        sortBy: { column: 'name', order: 'asc' }
      });

      if (error) {
        filesList.innerHTML = '<div style="padding:1rem;color:#b91c1c;text-align:center;">Failed to load files.</div>';
        return;
      }

      if (!data || data.length === 0) {
        filesList.innerHTML = `<div style="padding:1rem;color:#9ca3af;text-align:center;font-size:0.85rem;">No files found for ${subj}.</div>`;
        return;
      }

      filesList.innerHTML = '';
      data.forEach(file => {
        const row = document.createElement('div');
        row.className = 'manage-row';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'manage-name';
        nameSpan.textContent = file.name;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = 'Delete';
        const filePath = `${folder}/${file.name}`;

        delBtn.addEventListener('click', async () => {
          if (!confirm(`Delete "${file.name}" for ${subj}?`)) return;

          delBtn.disabled = true;
          delBtn.textContent = 'Deleting...';

          const { error: delError } = await sb.storage.from('notes').remove([filePath]);

          if (delError) {
            alert('Failed to delete: ' + delError.message);
            delBtn.disabled = false;
            delBtn.textContent = 'Delete';
            return;
          }

          row.remove();
          if (!filesList.querySelector('.manage-row')) {
            filesList.innerHTML = `<div style="padding:1rem;color:#9ca3af;text-align:center;font-size:0.85rem;">No files left for ${subj}.</div>`;
          }
        });

        row.appendChild(nameSpan);
        row.appendChild(delBtn);
        filesList.appendChild(row);
      });
    }

    document.getElementById('loadFilesBtn').addEventListener('click', () => {
      loadFilesForSubject(document.getElementById('manageSubjectSelect').value);
    });
  </script>
</body>

</html>
