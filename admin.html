<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Upload - Physics Cycle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .admin-card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.25rem;
      color: #1e293b;
    }

    .admin-card label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: #475569;
      margin-top: 0.85rem;
      margin-bottom: 0.3rem;
    }

    .admin-card select,
    .admin-card input[type="file"],
    .admin-card input[type="password"],
    .admin-card input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.92rem;
      box-sizing: border-box;
    }

    .admin-btn {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.75rem 1.6rem;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: var(--transition-smooth);
    }

    .admin-btn:hover {
      background: var(--primary-hover-gradient);
      transform: translateY(-1px);
    }

    .admin-btn.secondary {
      background: #64748b;
      box-shadow: none;
    }

    .admin-btn.secondary:hover {
      background: #475569;
    }

    .status-msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
      font-weight: 500;
    }

    .status-msg.success {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .status-msg.error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      display: block;
    }

    .status-msg.loading {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      display: block;
    }

    .manage-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.88rem;
    }

    .manage-row:last-child {
      border-bottom: none;
    }

    .manage-name {
      word-break: break-all;
      font-weight: 500;
      color: #1e293b;
    }

    .delete-btn {
      flex-shrink: 0;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.78rem;
      border: none;
      cursor: pointer;
      background: #ef4444;
      color: #ffffff;
      font-weight: 600;
      transition: var(--transition-smooth);
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    .files-box {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      max-height: 280px;
      overflow-y: auto;
      background: #f9fafb;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">Physics Cycle – Admin</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="branches.html" class="nav-link">Notes</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- UPLOAD SECTION -->
    <div class="admin-card">
      <h2>Upload PDF Note</h2>
      <p style="font-size:0.88rem;color:#64748b;margin-bottom:0.5rem;">
        Choose a subject and PDF file to upload to the notes storage.
      </p>

      <form id="uploadForm">
        <label>Subject</label>
        <select id="subjectSelect">
          <option value="PSP">PSP</option>
          <option value="Physics">Physics</option>
          <option value="Calculus">Calculus</option>
          <option value="Basic Electronics">Basic Electronics</option>
          <option value="BEEE">BEEE</option>
          <option value="ADLD">ADLD</option>
          <option value="UHV">UHV</option>
          <option value="COI">COI</option>
          <option value="EME">EME</option>
          <option value="Electric Circuit Analysis">Electric Circuit Analysis</option>
        </select>

        <label>Document Type / Prefix</label>
        <select id="docType">
          <option value="Chapter_1">Chapter 1</option>
          <option value="Chapter_2">Chapter 2</option>
          <option value="Chapter_3">Chapter 3</option>
          <option value="Chapter_4">Chapter 4</option>
          <option value="Chapter_5">Chapter 5</option>
          <option value="MCQ">MCQ</option>
          <option value="Question_Bank">Question Bank</option>
          <option value="Notes">Notes</option>
        </select>

        <label>PDF File</label>
        <input id="fileInput" type="file" accept="application/pdf" required>

        <button type="submit" class="admin-btn">Upload Note</button>
      </form>

      <div id="uploadStatus" class="status-msg"></div>
    </div>

    <!-- MANAGE SECTION -->
    <div class="admin-card">
      <h2>Manage Files</h2>
      <p style="font-size:0.88rem;color:#64748b;margin-bottom:0.75rem;">
        Select a subject to view and delete its notes.
      </p>

      <div style="display:flex; gap:1rem; align-items:flex-end; margin-bottom:1rem;">
        <div style="flex:1;">
          <label style="margin-top:0;">Subject</label>
          <select id="manageSubjectSelect" style="margin-bottom:0;">
            <option value="PSP">PSP</option>
            <option value="Physics">Physics</option>
            <option value="Calculus">Calculus</option>
            <option value="Basic Electronics">Basic Electronics</option>
            <option value="BEEE">BEEE</option>
            <option value="ADLD">ADLD</option>
            <option value="UHV">UHV</option>
            <option value="COI">COI</option>
            <option value="EME">EME</option>
            <option value="Electric Circuit Analysis">Electric Circuit Analysis</option>
          </select>
        </div>
        <button id="loadFilesBtn" class="admin-btn secondary" style="margin-top:0;">Load Files</button>
      </div>

      <div id="filesList" class="files-box">
        <div style="padding:1.25rem;color:#9ca3af;font-size:0.88rem;text-align:center;">No subject selected.</div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Physics Cycle • By Sujanraj. All rights reserved.</p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://brvbbxbfcrcpgkxxfuhv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydmJieGJmY3JjcGdreHhmdWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1NzM1MzIsImV4cCI6MjA4MDE0OTUzMn0.Z8FYzhVSn0eMgQAWcXg9ul70AeSyWMid4dFtrhAZalQ';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const uploadForm = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const subjectSelect = document.getElementById('subjectSelect');
    const docType = document.getElementById('docType');
    const uploadStatus = document.getElementById('uploadStatus');

    function setStatus(msg, type) {
      uploadStatus.textContent = msg;
      uploadStatus.className = 'status-msg ' + type;
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = fileInput.files[0];
      if (!file) { setStatus('Please choose a PDF file.', 'error'); return; }

      const subject = subjectSelect.value;
      const dtype = docType.value;
      const fileName = `${dtype}_${file.name}`;
      const path = `semester1/${subject}/${fileName}`;

      setStatus('Uploading note to storage…', 'loading');

      try {
        const { error } = await supabase
          .storage
          .from('notes')
          .upload(path, file, { upsert: true });

        if (error) {
          setStatus('Upload failed: ' + error.message, 'error');
          return;
        }

        setStatus('✅ Uploaded successfully!', 'success');
        fileInput.value = '';

        if (document.getElementById('manageSubjectSelect').value === subject) {
          loadFilesForSubject(subject);
        }
      } catch (err) {
        setStatus('Upload failed: ' + err.message, 'error');
      }
    });

    async function loadFilesForSubject(subj) {
      const filesList = document.getElementById('filesList');
      filesList.innerHTML = '<div style="padding:1.25rem;color:#6b7280;text-align:center;font-size:0.88rem;">Loading files…</div>';

      const folder = `semester1/${subj}`;

      try {
        const { data, error } = await supabase
          .storage
          .from('notes')
          .list(folder, {
            limit: 100,
            sortBy: { column: 'name', order: 'asc' }
          });

        if (error) {
          filesList.innerHTML = `<div style="padding:1.25rem;color:#b91c1c;text-align:center;">Failed to load files: ${error.message}</div>`;
          return;
        }

        const validFiles = (data || []).filter(f => f.name !== '.emptyFolderPlaceholder' && f.name !== '.gitkeep');

        if (validFiles.length === 0) {
          filesList.innerHTML = `<div style="padding:1.25rem;color:#9ca3af;text-align:center;font-size:0.88rem;">No files found for ${subj}.</div>`;
          return;
        }

        filesList.innerHTML = '';
        validFiles.forEach(file => {
          const row = document.createElement('div');
          row.className = 'manage-row';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'manage-name';
          nameSpan.textContent = file.name;

          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.textContent = 'Delete';

          delBtn.addEventListener('click', async () => {
            if (!confirm(`Delete "${file.name}" for ${subj}?`)) return;

            delBtn.disabled = true;
            delBtn.textContent = 'Deleting…';

            const { error: delErr } = await supabase
              .storage
              .from('notes')
              .remove([`${folder}/${file.name}`]);

            if (delErr) {
              alert('Failed to delete: ' + delErr.message);
              delBtn.disabled = false;
              delBtn.textContent = 'Delete';
              return;
            }

            row.remove();
            if (!filesList.querySelector('.manage-row')) {
              filesList.innerHTML = `<div style="padding:1.25rem;color:#9ca3af;text-align:center;font-size:0.88rem;">No files left for ${subj}.</div>`;
            }
          });

          row.appendChild(nameSpan);
          row.appendChild(delBtn);
          filesList.appendChild(row);
        });

      } catch (err) {
        filesList.innerHTML = `<div style="padding:1.25rem;color:#b91c1c;text-align:center;">Error: ${err.message}</div>`;
      }
    }

    document.getElementById('loadFilesBtn').addEventListener('click', () => {
      loadFilesForSubject(document.getElementById('manageSubjectSelect').value);
    });
  </script>
</body>

</html>
