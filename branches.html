<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Physics Cycle Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">Physics Cycle</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="branches.html" class="nav-link active">Notes</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 1. Subject Selection -->
    <div class="card">
      <h2>Select Subject</h2>
      <div class="btn-grid" id="subjectButtons">
        <button class="btn" onclick="selectSubject('PSP')">PSP</button>
        <button class="btn" onclick="selectSubject('Physics')">Physics</button>
        <button class="btn" onclick="selectSubject('Calculus')">Calculus</button>
        <button class="btn" onclick="selectSubject('Basic Electronics')">Basic Electronics</button>
        <button class="btn" onclick="selectSubject('BEEE')">BEEE</button>
        <button class="btn" onclick="selectSubject('ADLD')">ADLD</button>
        <button class="btn" onclick="selectSubject('UHV')">UHV</button>
        <button class="btn" onclick="selectSubject('COI')">COI</button>
        <button class="btn" onclick="selectSubject('EME')">EME</button>
        <button class="btn" onclick="selectSubject('Electric Circuit Analysis')">Electric Circuit Analysis</button>
      </div>
    </div>

    <!-- Status Message Area -->
    <div id="statusArea" class="hidden"></div>

    <!-- 2. File List (Hidden by default) -->
    <div id="fileCard" class="card hidden">
      <h2 id="fileCardTitle">Notes</h2>
      <ul id="fileList" class="file-list"></ul>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Physics Cycle • By Sujanraj. All rights reserved.</p>
  </footer>

  <!-- Supabase JS Client Module -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://brvbbxbfcrcpgkxxfuhv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydmJieGJmY3JjcGdreHhmdWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1NzM1MzIsImV4cCI6MjA4MDE0OTUzMn0.Z8FYzhVSn0eMgQAWcXg9ul70AeSyWMid4dFtrhAZalQ';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const GITHUB_OWNER = 'sujanrajyt-ui';
    const GITHUB_REPO = 'physics-cycle';

    window.selectSubject = async function (subjectName) {
      highlightSubject(subjectName);
      document.getElementById('fileCard').classList.add('hidden');
      showStatus(`Loading notes for ${subjectName}...`, 'loading');

      let files = [];

      // 1. Try Supabase Storage (semester1/${subjectName})
      try {
        const { data, error } = await supabase
          .storage
          .from('notes')
          .list(`semester1/${subjectName}`, {
            limit: 100,
            sortBy: { column: 'name', order: 'asc' }
          });

        if (!error && data && data.length > 0) {
          files = data
            .filter(f => f.name !== '.emptyFolderPlaceholder' && f.name !== '.gitkeep')
            .map(f => {
              const { data: pubData } = supabase
                .storage
                .from('notes')
                .getPublicUrl(`semester1/${subjectName}/${f.name}`);
              return {
                name: f.name,
                url: pubData.publicUrl
              };
            });
        }
      } catch (err) {
        console.warn('Supabase fetch failed:', err);
      }

      // 2. Fallback to Supabase Storage (notes/${subjectName}) if empty
      if (files.length === 0) {
        try {
          const { data, error } = await supabase
            .storage
            .from('notes')
            .list(`notes/${subjectName}`, {
              limit: 100,
              sortBy: { column: 'name', order: 'asc' }
            });

          if (!error && data && data.length > 0) {
            files = data
              .filter(f => f.name !== '.emptyFolderPlaceholder' && f.name !== '.gitkeep')
              .map(f => {
                const { data: pubData } = supabase
                  .storage
                  .from('notes')
                  .getPublicUrl(`notes/${subjectName}/${f.name}`);
                return {
                  name: f.name,
                  url: pubData.publicUrl
                };
              });
          }
        } catch (_) { }
      }

      // 3. Fallback to GitHub API if Supabase returns 0 files
      if (files.length === 0) {
        try {
          const ghUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/notes/${encodeURIComponent(subjectName)}`;
          const ghRes = await fetch(ghUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
          if (ghRes.ok) {
            const ghData = await ghRes.json();
            if (Array.isArray(ghData)) {
              files = ghData
                .filter(item => item.type === 'file' && item.name !== '.gitkeep')
                .map(item => ({
                  name: item.name,
                  url: item.download_url
                }));
            }
          }
        } catch (_) { }
      }

      // 4. Render results or display friendly empty message
      if (files.length === 0) {
        showStatus(`No notes uploaded yet for ${subjectName}.`, 'empty');
        return;
      }

      hideStatus();
      document.getElementById('fileCardTitle').textContent = `${subjectName} Notes`;
      renderFiles(files);
    };

    function showStatus(msg, type) {
      const el = document.getElementById('statusArea');
      el.className = `status-box status-${type}`;
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideStatus() {
      document.getElementById('statusArea').classList.add('hidden');
    }

    function highlightSubject(name) {
      document.querySelectorAll('#subjectButtons .btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText === name) btn.classList.add('active');
      });
    }

    function renderFiles(files) {
      const list = document.getElementById('fileList');
      list.innerHTML = '';

      files.forEach(file => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'file-link';
        a.href = file.url;
        a.target = '_blank';
        // Clean display name
        a.innerText = file.name.replace(/\.[^/.]+$/, '').replace(/_/g, ' ');
        li.appendChild(a);
        list.appendChild(li);
      });

      document.getElementById('fileCard').classList.remove('hidden');
    }
  </script>
</body>

</html>
