<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Physics Cycle Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">Physics Cycle</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="branches.html" class="nav-link active">Notes</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 1. Subject Selection -->
    <div class="card">
      <h2>Select Subject</h2>
      <div class="btn-grid" id="subjectButtons">
        <button class="btn" onclick="selectSubject('PSP')">PSP</button>
        <button class="btn" onclick="selectSubject('Physics')">Physics</button>
        <button class="btn" onclick="selectSubject('Calculus')">Calculus</button>
        <button class="btn" onclick="selectSubject('Basic Electronics')">Basic Electronics</button>
        <button class="btn" onclick="selectSubject('BEEE')">BEEE</button>
        <button class="btn" onclick="selectSubject('ADLD')">ADLD</button>
        <button class="btn" onclick="selectSubject('UHV')">UHV</button>
        <button class="btn" onclick="selectSubject('COI')">COI</button>
        <button class="btn" onclick="selectSubject('EME')">EME</button>
        <button class="btn" onclick="selectSubject('Electric Circuit Analysis')">Electric Circuit Analysis</button>
      </div>
    </div>

    <!-- Status Message Area -->
    <div id="statusArea" class="hidden"></div>

    <!-- 2. File List (Hidden by default) -->
    <div id="fileCard" class="card hidden">
      <h2 id="fileCardTitle">Notes</h2>
      <ul id="fileList" class="file-list"></ul>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Physics Cycle • By Sujanraj. All rights reserved.</p>
  </footer>

  <script>
    const GITHUB_OWNER = 'sujanrajyt-ui';
    const GITHUB_REPO = 'physics-cycle';
    const GITHUB_BRANCH = 'main';
    const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;

    let notesIndexCache = null;

    async function loadNotesIndex() {
      if (notesIndexCache) return notesIndexCache;

      // Try local notes.json first
      try {
        const res = await fetch('notes.json');
        if (res.ok) {
          notesIndexCache = await res.json();
          return notesIndexCache;
        }
      } catch (_) { }

      // Try raw GitHub notes.json
      try {
        const res = await fetch(`${RAW_BASE}/notes.json`);
        if (res.ok) {
          notesIndexCache = await res.json();
          return notesIndexCache;
        }
      } catch (_) { }

      return null;
    }

    async function selectSubject(subjectName) {
      highlightSubject(subjectName);
      document.getElementById('fileCard').classList.add('hidden');
      showStatus(`Loading notes for ${subjectName}...`, 'loading');

      let fileNames = [];

      // 1. Try static notes.json index (GitHub raw / local - 0 API limits, instant)
      const indexData = await loadNotesIndex();
      if (indexData && indexData[subjectName]) {
        fileNames = indexData[subjectName];
      }

      // 2. Fallback to GitHub Contents API if index is unavailable
      if (!indexData) {
        try {
          const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/notes/${encodeURIComponent(subjectName)}`;
          const apiRes = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
          if (apiRes.ok) {
            const apiData = await apiRes.json();
            if (Array.isArray(apiData)) {
              fileNames = apiData
                .filter(item => item.type === 'file' && item.name !== '.gitkeep')
                .map(item => item.name);
            }
          }
        } catch (_) { }
      }

      if (!fileNames || fileNames.length === 0) {
        showStatus(`No notes uploaded yet for ${subjectName}.`, 'empty');
        return;
      }

      hideStatus();
      document.getElementById('fileCardTitle').textContent = `${subjectName} Notes`;
      renderFiles(subjectName, fileNames);
    }

    function showStatus(msg, type) {
      const el = document.getElementById('statusArea');
      el.className = `status-box status-${type}`;
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideStatus() {
      document.getElementById('statusArea').classList.add('hidden');
    }

    function highlightSubject(name) {
      document.querySelectorAll('#subjectButtons .btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText === name) btn.classList.add('active');
      });
    }

    function renderFiles(subjectName, fileNames) {
      const list = document.getElementById('fileList');
      list.innerHTML = '';

      fileNames.forEach(name => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'file-link';
        // Direct GitHub raw CDN link
        a.href = `${RAW_BASE}/notes/${encodeURIComponent(subjectName)}/${encodeURIComponent(name)}`;
        a.target = '_blank';
        // Clean display name
        a.innerText = name.replace(/\.[^/.]+$/, '').replace(/_/g, ' ');
        li.appendChild(a);
        list.appendChild(li);
      });

      document.getElementById('fileCard').classList.remove('hidden');
    }
  </script>
</body>

</html>
